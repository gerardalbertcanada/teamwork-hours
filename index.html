<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9Cloud — Weekly Hours Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0c1222 0%, #1a1f35 100%);
      color: #e2e8f0;
      min-height: 100vh;
    }

    .dashboard { max-width: 1100px; margin: 0 auto; padding: 20px; }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .header h1 {
      font-size: 24px; font-weight: 700;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-sub { color: #64748b; font-size: 13px; margin-top: 2px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }

    .btn {
      padding: 8px 18px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .last-updated { font-size: 11px; color: #475569; }

    .week-banner {
      background: rgba(6,182,212,0.08);
      border: 1px solid rgba(6,182,212,0.2);
      border-radius: 10px; padding: 12px 18px;
      margin-bottom: 24px; font-size: 13px; color: #94a3b8;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    .week-banner strong { color: #e2e8f0; }

    /* Chart */
    .chart-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 20px;
      margin-bottom: 24px;
    }
    .chart-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .chart-subtitle { font-size: 12px; color: #64748b; margin-bottom: 16px; }

    /* Accordion */
    .table-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; overflow: hidden;
      margin-bottom: 24px;
    }
    .table-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 15px; font-weight: 600;
    }
    .accordion-item { border-bottom: 1px solid rgba(255,255,255,0.04); }
    .accordion-item:last-child { border-bottom: none; }
    .accordion-trigger {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 20px; background: none; border: none; cursor: pointer;
      font-family: inherit; color: #e2e8f0; text-align: left; transition: background 0.15s;
    }
    .accordion-trigger:hover { background: rgba(255,255,255,0.03); }
    .accordion-trigger-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .accordion-chevron {
      flex-shrink: 0; width: 16px; height: 16px; color: #64748b;
      transition: transform 0.2s;
    }
    .accordion-chevron.open { transform: rotate(90deg); color: #06b6d4; }
    .accordion-rank { color: #475569; font-size: 13px; width: 20px; flex-shrink: 0; }
    .accordion-name { font-size: 13px; font-weight: 500; }
    .accordion-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .accordion-task-count { font-size: 11px; color: #64748b; }
    .accordion-hours { font-size: 13px; font-weight: 600; color: #e2e8f0; min-width: 56px; text-align: right; }
    .accordion-body { padding: 0 20px 14px 46px; display: flex; flex-direction: column; gap: 2px; }
    .accordion-task-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 7px 10px; border-radius: 6px; font-size: 12.5px;
    }
    .accordion-task-row:hover { background: rgba(255,255,255,0.03); }
    .accordion-task-link {
      color: #94a3b8; text-decoration: none; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .accordion-task-link:hover { color: #06b6d4; text-decoration: underline; }
    .accordion-task-noLink { color: #64748b; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .accordion-task-hours { color: #94a3b8; flex-shrink: 0; }
    .accordion-empty { padding: 7px 10px; font-size: 12.5px; color: #475569; }

    .no-data { text-align: center; padding: 40px; color: #475569; font-size: 14px; }

    /* Loading */
    .loading-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 20px; gap: 16px;
    }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #06b6d4;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #64748b; font-size: 14px; }

    .error-banner {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 10px; padding: 14px 20px;
      margin-bottom: 20px; color: #f87171; font-size: 13px;
    }

    .footer {
      text-align: center; padding: 20px; font-size: 12px; color: #475569;
    }
    .footer span { color: #06b6d4; }

    @media (max-width: 768px) {
      .dashboard { padding: 12px; }
      .accordion-body { padding-left: 32px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.1.16/umd/Recharts.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;
    const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, LabelList } = Recharts;

    const API_BASE = '/api/teamwork';

    // Fixed staff roster — only these people are shown on the dashboard,
    // even if they logged zero hours last week.
    const STAFF = [
      { id: 90852,  label: 'Mary Lynn' },
      { id: 109919, label: 'Salim' },
      { id: 608372, label: 'Isha' },
      { id: 360446, label: 'Nusrat' },
      { id: 360448, label: 'Ashraf' },
      { id: 610444, label: 'Carina' },
      { id: 593117, label: 'Gerard' },
      { id: 205276, label: 'Mark' },
      { id: 90854,  label: 'Anne Katherine' },
      { id: 216554, label: 'Wasim' },
      { id: 577282, label: 'Pankaj' },
    ];

    const COLORS = ['#06b6d4', '#8b5cf6', '#f59e0b', '#10b981', '#ef4444', '#ec4899', '#6366f1', '#14b8a6', '#84cc16', '#f97316', '#38bdf8'];

    const TEAMWORK_DOMAIN = 'https://9cloudwebworks.teamwork.com';
    function taskUrl(taskId) {
      return `${TEAMWORK_DOMAIN}/app/tasks/${taskId}`;
    }

    function api(endpoint, params = {}) {
      const query = new URLSearchParams({ endpoint, ...params });
      return fetch(`${API_BASE}?${query}`).then(r => {
        if (!r.ok) throw new Error(`API ${r.status}`);
        return r.json();
      });
    }

    // Fetch all pages for a paginated endpoint
    async function fetchAllPages(endpoint, key, params = {}, onProgress) {
      const first = await api(endpoint, { ...params, page: '1', pageSize: '250' });
      let allItems = first[key] || [];
      const totalPages = (first._pagination && first._pagination.pages) || 1;
      if (onProgress) onProgress(1, totalPages);

      if (totalPages <= 1) return allItems;

      const batchSize = 5;
      for (let start = 2; start <= totalPages; start += batchSize) {
        const end = Math.min(start + batchSize - 1, totalPages);
        const batch = [];
        for (let p = start; p <= end; p++) {
          batch.push(api(endpoint, { ...params, page: String(p), pageSize: '250' }));
        }
        const results = await Promise.all(batch);
        results.forEach(r => { allItems = allItems.concat(r[key] || []); });
        if (onProgress) onProgress(end, totalPages);
      }
      return allItems;
    }

    function toYYYYMMDD(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}${m}${day}`;
    }

    function formatDate(d) {
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // The most recently completed Mon–Sun week, relative to today.
    // If today is Monday 9/14, this resolves to Mon 9/7 – Sun 9/13.
    function getPreviousWeekRange() {
      const now = new Date();
      const dow = now.getDay(); // 0 = Sun, 1 = Mon, ... 6 = Sat
      const diffToMonday = dow === 0 ? 6 : dow - 1;
      const thisMonday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMonday);
      const prevMonday = new Date(thisMonday);
      prevMonday.setDate(thisMonday.getDate() - 7);
      const prevSunday = new Date(thisMonday);
      prevSunday.setDate(thisMonday.getDate() - 1);
      return { start: prevMonday, end: prevSunday };
    }

    function WeeklyHoursDashboard() {
      const [timeEntries, setTimeEntries] = useState([]);
      const [loading, setLoading] = useState(true);
      const [loadingMsg, setLoadingMsg] = useState('Loading last week\u2019s hours\u2026');
      const [error, setError] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [expanded, setExpanded] = useState({});

      const { start: weekStart, end: weekEnd } = useMemo(getPreviousWeekRange, []);

      const toggleExpanded = (personId) => {
        setExpanded(prev => ({ ...prev, [personId]: !prev[personId] }));
      };

      const fetchData = useCallback(async () => {
        setLoading(true);
        setError(null);
        try {
          setLoadingMsg('Loading last week\u2019s time entries\u2026');
          const entries = await fetchAllPages(
            'time_entries.json', 'time-entries',
            { fromdate: toYYYYMMDD(weekStart), todate: toYYYYMMDD(weekEnd) },
            (p, t) => setLoadingMsg(`Loading time entries... page ${p}/${t}`)
          );
          setTimeEntries(entries);
          setLastUpdated(new Date());
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
          setLoadingMsg('');
        }
      }, [weekStart, weekEnd]);

      useEffect(() => { fetchData(); }, [fetchData]);

      // Aggregate hours per roster member (always shows all 11, even at 0h)
      const chartData = useMemo(() => {
        const map = {};
        STAFF.forEach((s, i) => {
          map[s.id] = { id: s.id, name: s.label, hours: 0, color: COLORS[i % COLORS.length] };
        });
        timeEntries.forEach(entry => {
          const pid = Number(entry['person-id']);
          if (map[pid]) {
            map[pid].hours += parseFloat(entry.hoursDecimal) || 0;
          }
        });
        return Object.values(map)
          .map(d => ({ ...d, hours: Math.round(d.hours * 100) / 100 }))
          .sort((a, b) => b.hours - a.hours);
      }, [timeEntries]);

      // Per-person breakdown by individual task, for the accordion —
      // each task entry links back to Teamwork.
      const tasksByPerson = useMemo(() => {
        const map = {};
        STAFF.forEach(s => { map[s.id] = {}; });
        timeEntries.forEach(entry => {
          const pid = Number(entry['person-id']);
          if (!(pid in map)) return;
          const taskId = entry['todo-item-id'] || null;
          const taskName = entry['todo-item-name'] || entry.description || 'Untitled time entry';
          const key = taskId || `no-task-${taskName}`;
          if (!map[pid][key]) {
            map[pid][key] = { taskId, taskName, hours: 0 };
          }
          map[pid][key].hours += parseFloat(entry.hoursDecimal) || 0;
        });
        const result = {};
        Object.keys(map).forEach(pid => {
          result[pid] = Object.values(map[pid])
            .map(t => ({ ...t, hours: Math.round(t.hours * 100) / 100 }))
            .sort((a, b) => b.hours - a.hours);
        });
        return result;
      }, [timeEntries]);

      const CustomTooltip = ({ active, payload }) => {
        if (!active || !payload?.length) return null;
        const data = payload[0]?.payload;
        return (
          <div style={{
            background: '#1e293b', border: '1px solid rgba(255,255,255,0.1)',
            borderRadius: 8, padding: '10px 14px', fontSize: 13,
            boxShadow: '0 8px 24px rgba(0,0,0,0.4)',
          }}>
            <div style={{ fontWeight: 600, marginBottom: 4 }}>{data?.name}</div>
            <div style={{ color: '#94a3b8' }}>{data?.hours}h logged</div>
          </div>
        );
      };

      return (
        <div className="dashboard">
          <div className="header">
            <div>
              <h1>☁ Weekly Hours Dashboard</h1>
              <div className="header-sub">Hours logged per staff member, last week</div>
            </div>
            <div className="header-actions">
              {lastUpdated && <span className="last-updated">Updated {lastUpdated.toLocaleTimeString()}</span>}
              <button className="btn btn-primary" onClick={fetchData} disabled={loading}>
                {loading ? '⟳ Loading…' : '↻ Refresh'}
              </button>
            </div>
          </div>

          <div className="week-banner">
            <span>Showing: <strong>{formatDate(weekStart)} – {formatDate(weekEnd)}</strong></span>
            <span>Roster: {STAFF.length} staff members</span>
          </div>

          {error && (
            <div className="error-banner">
              ⚠ Failed to load data: {error}. Check your API configuration and try refreshing.
            </div>
          )}

          {loading ? (
            <div className="loading-state">
              <div className="spinner" />
              <div className="loading-text">{loadingMsg}</div>
            </div>
          ) : (
            <>
              <div className="chart-card">
                <div className="chart-title">Hours Logged by Staff</div>
                <div className="chart-subtitle">{formatDate(weekStart)} – {formatDate(weekEnd)}</div>
                {chartData.length > 0 ? (
                  <ResponsiveContainer width="100%" height={Math.max(320, chartData.length * 40)}>
                    <BarChart data={chartData} layout="vertical" margin={{ left: 10, right: 40, top: 5, bottom: 5 }}>
                      <XAxis type="number" tick={{ fill: '#64748b', fontSize: 12 }} axisLine={false} tickLine={false} />
                      <YAxis type="category" dataKey="name" width={120}
                        tick={{ fill: '#94a3b8', fontSize: 12 }} axisLine={false} tickLine={false} />
                      <Tooltip content={<CustomTooltip />} cursor={{ fill: 'rgba(6,182,212,0.06)' }} />
                      <Bar dataKey="hours" name="Hours" radius={[0, 4, 4, 0]} barSize={20}>
                        <LabelList dataKey="hours" position="right" formatter={v => `${v}h`} style={{ fill: '#e2e8f0', fontSize: 12, fontWeight: 600 }} />
                        {chartData.map((d, i) => <Recharts.Cell key={i} fill={d.color} />)}
                      </Bar>
                    </BarChart>
                  </ResponsiveContainer>
                ) : (
                  <div className="no-data">No data to display</div>
                )}
              </div>

              <div className="table-card">
                <div className="table-header">Hours Breakdown</div>
                {chartData.map((d, i) => {
                  const tasks = tasksByPerson[d.id] || [];
                  const isOpen = !!expanded[d.id];
                  return (
                    <div className="accordion-item" key={d.id}>
                      <button className="accordion-trigger" onClick={() => toggleExpanded(d.id)}>
                        <span className="accordion-trigger-left">
                          <svg className={`accordion-chevron ${isOpen ? 'open' : ''}`} viewBox="0 0 16 16" fill="none">
                            <path d="M6 4l4 4-4 4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
                          </svg>
                          <span className="accordion-rank">{i + 1}</span>
                          <span className="accordion-name">{d.name}</span>
                        </span>
                        <span className="accordion-right">
                          <span className="accordion-task-count">{tasks.length} task{tasks.length === 1 ? '' : 's'}</span>
                          <span className="accordion-hours">{d.hours.toFixed(2)}h</span>
                        </span>
                      </button>
                      {isOpen && (
                        <div className="accordion-body">
                          {tasks.length > 0 ? tasks.map((t, ti) => (
                            <div className="accordion-task-row" key={t.taskId || ti}>
                              {t.taskId ? (
                                <a
                                  className="accordion-task-link"
                                  href={taskUrl(t.taskId)}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  title={t.taskName}
                                >
                                  {t.taskName}
                                </a>
                              ) : (
                                <span className="accordion-task-noLink" title={t.taskName}>{t.taskName}</span>
                              )}
                              <span className="accordion-task-hours">{t.hours.toFixed(2)}h</span>
                            </div>
                          )) : (
                            <div className="accordion-empty">No time entries logged</div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              <div className="footer">
                Connected to <span>9cloudwebworks.teamwork.com</span>
                {lastUpdated && <> • Data synced {lastUpdated.toLocaleString()}</>}
              </div>
            </>
          )}
        </div>
      );
    }

    ReactDOM.render(<WeeklyHoursDashboard />, document.getElementById('root'));
  </script>
</body>
</html>
